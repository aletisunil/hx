# The end-to-end suite, not HX. HX is the TypeScript build in src/, published
# to npm (package.json). These tests drive its bundle from the outside - a pty,
# a stub model server, files and exit codes - and never import it.

[project]
name = "hx-e2e"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "pytest>=8.2",
  # A VT emulator, so tests can assert what the differ actually paints rather
  # than what it claims to have written.
  "pyte>=0.8",
  "ruff>=0.6",
  # A throwaway CA, so the TLS tests can stand up the intercepting proxy a
  # corporate network puts between HX and the API.
  "trustme>=1.2",
  # scripts/gen-unicode-tables.py measures widths with it.
  "wcwidth>=0.2.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Blocking filesystem calls are the point in a test assertion, not a hazard.
# RUF001: the TUI's glyphs are deliberate, and a test has to spell them exactly.
"tests/*" = ["B011", "ASYNC240", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "e2e: drives the hx bundle against a local stand-in for each model route",
]
