[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hx"
version = "0.0.1"
description = "HX - a terminal coding agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sunil Aleti" }]
keywords = ["agent", "cli", "tui", "llm", "openrouter", "coding-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "textual>=0.85",
  "rich>=13.7",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "textual-dev>=1.5",
  "types-PyYAML",
]

[project.scripts]
hx = "hx.cli:main"

[project.urls]
Homepage = "https://github.com/sunilaleti/hx"
Issues = "https://github.com/sunilaleti/hx/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hx"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src/hx"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = []

[[tool.mypy.overrides]]
module = ["textual.*", "textual_dev.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "live: hits the real OpenRouter API (requires OPENROUTER_API_KEY)",
  "sandbox: requires sandbox-exec (macOS) or bwrap (Linux)",
]
