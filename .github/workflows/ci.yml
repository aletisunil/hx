name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        # Every supported minor on Linux catches version bugs; macOS runs the
        # floor and the ceiling only, to catch platform bugs without paying for
        # the full OS x version grid.
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev --python ${{ matrix.python }}
      # bubblewrap, so the Linux sandbox tests run instead of skipping. Ubuntu
      # 24.04 confines unprivileged user namespaces with AppArmor, which bwrap
      # needs; the runner is throwaway, so lift that rather than ship a profile.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # `live` needs an API key and real spend, so it never runs in CI.
      - run: uv run pytest -m "not live"
      # What every end-to-end test saw, screen by screen - pass or fail.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ matrix.os }}-${{ matrix.python }}
          path: e2e-report/

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh
      - name: install from a clean container
        run: |
          docker run --rm -v "$PWD:/src" debian:bookworm-slim bash -c '
            set -eux
            apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
            cd /tmp
            HX_PACKAGE=/src sh /src/install.sh
            export PATH="$HOME/.local/bin:$PATH"
            hx --version
          '

  publish:
    needs: [lint, test, install-script]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      # The wheel about to ship, not the checkout: it is what `hx --version`
      # and `hx changelog` will answer from once installed. Both are checked
      # before PyPI, which cannot be undone: a tag without its CHANGELOG
      # section stops here. The notes are that section without its heading -
      # the release title already says which version it is.
      - name: the tag names the version being built
        run: |
          wheel=$(ls dist/*.whl)
          built=$(uvx --from "$wheel" hx --version)
          test "$built" = "hx ${GITHUB_REF_NAME#v}" || {
            echo "::error::tag $GITHUB_REF_NAME builds $built"
            exit 1
          }
          uvx --from "$wheel" hx changelog "$GITHUB_REF_NAME" | tail -n +3 > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || {
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          }
      # Trusted publishing: no long-lived token stored in the repo. A rerun
      # finds the files already there and goes on to the release.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      # After PyPI, so a release on GitHub always has a package behind it. A
      # rerun keeps the release that is already there.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "hx ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
