name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v3
      - run: npm ci
      - run: npm run check
      # The end-to-end suite's own Python.
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the floor package.json promises; the newest release
        # catches what a fresh install meets.
        os: [ubuntu-latest, macos-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: astral-sh/setup-uv@v3
      - run: npm ci
      # bubblewrap, so the Linux sandbox tests run instead of skipping. Ubuntu
      # 24.04 confines unprivileged user namespaces with AppArmor, which bwrap
      # needs; the runner is throwaway, so lift that rather than ship a profile.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run e2e
      # What every end-to-end test saw, screen by screen - pass or fail.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ matrix.os }}-node${{ matrix.node }}
          path: e2e-report/

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh
      # The tarball npm would publish, installed by the script in a clean
      # container that has Node and nothing else.
      - run: npm ci && npm run build && npm pack
      - name: install from a clean container
        run: |
          docker run --rm -v "$PWD:/src" node:22-bookworm-slim bash -c '
            set -eux
            cd /tmp
            HX_PACKAGE=$(ls /src/sunilaleti-hx-*.tgz) sh /src/install.sh
            hx --version
          '

  # A push to main whose package.json version is not on npm yet is a
  # release: published to npm, tagged and released on GitHub. Any other push
  # publishes nothing. Bump the version to release; see README, Releasing.
  release:
    needs: [lint, test, install-script]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One release at a time: two quick pushes must not race to one version.
    concurrency: release
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # npm trusted publishing: no token stored in the repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Checked apart, so a rerun after a failed GitHub release still makes it.
      - name: what is missing for this version?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          publish=true
          npm view "$name@$version" version >/dev/null 2>&1 && publish=false
          release=true
          gh release view "v$version" >/dev/null 2>&1 && release=false
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "$name@$version: publish to npm $publish, GitHub release $release"
      - if: steps.version.outputs.publish == 'true' || steps.version.outputs.release == 'true'
        run: npm ci && npm run build
      # The bundle about to ship, not the checkout: it is what `hx --version`
      # and `hx changelog` answer from once installed. A version without its
      # CHANGELOG section stops here, before npm, which cannot be undone. The
      # notes are that section without its heading.
      - name: the version has a CHANGELOG section
        if: steps.version.outputs.publish == 'true' || steps.version.outputs.release == 'true'
        run: |
          version=${{ steps.version.outputs.version }}
          test "$(node dist/hx.js --version)" = "hx $version" || {
            echo "::error::package.json says $version, the bundle says $(node dist/hx.js --version)"
            exit 1
          }
          node dist/hx.js changelog "$version" | tail -n +3 > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || {
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          }
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - if: steps.version.outputs.publish == 'true'
        run: npm install --global npm@11
      - if: steps.version.outputs.publish == 'true'
        run: npm publish
      # After npm, so a release on GitHub always has a package behind it.
      - name: GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v${{ steps.version.outputs.version }}
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "hx ${tag#v}" --notes-file "$RUNNER_TEMP/notes.md"
