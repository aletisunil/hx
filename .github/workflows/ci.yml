name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        # Every supported minor on Linux catches version bugs; macOS runs the
        # floor and the ceiling only, to catch platform bugs without paying for
        # the full OS x version grid.
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev --python ${{ matrix.python }}
      # `live` needs an API key and real spend, so it never runs in CI.
      - run: uv run pytest -m "not live"

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh
      - name: install from a clean container
        run: |
          docker run --rm -v "$PWD:/src" debian:bookworm-slim bash -c '
            set -eux
            apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
            cd /tmp
            HX_PACKAGE=/src sh /src/install.sh
            export PATH="$HOME/.local/bin:$PATH"
            hx --version
          '

  publish:
    needs: [lint, test, install-script]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      # Trusted publishing: no long-lived token stored in the repo.
      - uses: pypa/gh-action-pypi-publish@release/v1
