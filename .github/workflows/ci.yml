name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v3
      - run: npm ci
      - run: npm run check
      # The end-to-end suite's own Python.
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the floor package.json promises; the newest release
        # catches what a fresh install meets.
        os: [ubuntu-latest, macos-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: astral-sh/setup-uv@v3
      - run: npm ci
      # bubblewrap, so the Linux sandbox tests run instead of skipping. Ubuntu
      # 24.04 confines unprivileged user namespaces with AppArmor, which bwrap
      # needs; the runner is throwaway, so lift that rather than ship a profile.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run e2e
      # What every end-to-end test saw, screen by screen - pass or fail.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ matrix.os }}-node${{ matrix.node }}
          path: e2e-report/

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh
      # The tarball npm would publish, installed by the script in a clean
      # container that has Node and nothing else.
      - run: npm ci && npm run build && npm pack
      - name: install from a clean container
        run: |
          docker run --rm -v "$PWD:/src" node:22-bookworm-slim bash -c '
            set -eux
            cd /tmp
            HX_PACKAGE=$(ls /src/sunilaleti-hx-*.tgz) sh /src/install.sh
            hx --version
          '

  release:
    needs: [lint, test, install-script]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      # The bundle about to be released, not the checkout: it is what
      # `hx --version` and `hx changelog` answer from once installed. A tag
      # without its CHANGELOG section stops here. The notes are that section
      # without its heading - the release title already says which version.
      - name: the tag names the version being built
        run: |
          built=$(node dist/hx.js --version)
          test "$built" = "hx ${GITHUB_REF_NAME#v}" || {
            echo "::error::tag $GITHUB_REF_NAME builds $built"
            exit 1
          }
          node dist/hx.js changelog "$GITHUB_REF_NAME" | tail -n +3 > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || {
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          }
      # npm publish stays a maintainer's step (see README, Releasing): the
      # release on GitHub records a version that is already on npm.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "hx ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
